[project]
name = "shop"
version = "0.1.0"
description = "Payment endpoint for an online shop (Flask, SQLAlchemy, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
packages = ["shop"]
mypy_path = "src"

[tool.alembic]
script_location = "%(here)s/migrations"

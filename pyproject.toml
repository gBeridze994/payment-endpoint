[project]
name = "shop"
version = "0.1.0"
description = "Payment endpoint for an online shop (Flask, SQLAlchemy, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
packages = ["shop"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.importlinter]
root_package = "shop"

[[tool.importlinter.contracts]]
name = "shop.users is imported only through its package (__init__.py)"
type = "protected"
protected_modules = ["shop.users.*"]
allowed_importers = ["shop.users"]

[[tool.importlinter.contracts]]
name = "shop.products is imported only through its package (__init__.py)"
type = "protected"
protected_modules = ["shop.products.*"]
allowed_importers = ["shop.products"]

[[tool.importlinter.contracts]]
name = "shop.carts is imported only through its package (__init__.py)"
type = "protected"
protected_modules = ["shop.carts.*"]
allowed_importers = ["shop.carts"]

[[tool.importlinter.contracts]]
name = "shop.payment_methods is imported only through its package (__init__.py)"
type = "protected"
protected_modules = ["shop.payment_methods.*"]
allowed_importers = ["shop.payment_methods"]

[[tool.importlinter.contracts]]
name = "shop.payments is imported only through its package (__init__.py)"
type = "protected"
protected_modules = ["shop.payments.*"]
allowed_importers = ["shop.payments"]

[tool.alembic]
script_location = "%(here)s/migrations"
